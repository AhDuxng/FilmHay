<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Trạm Đơn Phương - Xem phim online chất lượng cao, miễn phí" />
    <meta name="theme-color" content="#1e1e1e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <title>Trạm Đơn Phương - Xem Phim Online Chất Lượng Cao</title>

    <script>
      // Stamped before first paint so the page never flashes the wrong theme.
      // Dark is the default; light is what a visitor opts into.
      (function () {
        var theme = 'dark';
        try {
          if (localStorage.getItem('filmhay-theme') === 'light') {
            theme = 'light';
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
